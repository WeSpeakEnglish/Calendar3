<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year Calendar CZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* --- PocketBook / old-browser fallbacks (no CSS variables, grid, inset, env(), <dialog>) --- */
body { padding: 22px 16px 44px }

/* Layout: cosy wall calendar. Year view = soft month cards (weekdays as rows, weeks as columns);
   month view = classic 7-column grid with event chips. Side panel for the selected day. */
:root {
  --bg: #f3ede4; --surface: #fffaf4; --surface-2: #f8f0e5; --ink: #2f2925; --muted: #7c7066; --line: #e8ddcf;
  --heading: #9b2f45; --sun: #b8324b; --accent: #3f6b57; --accent-soft: #e1ebe2; --on-accent: #fffaf4;
  --t-holiday: #b8324b; --t-personal: #3a6ea5; --t-work: #3f8a5f; --t-birthday: #b87314; --t-other: #7d5ba6;
  --shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07);
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1916; --surface: #26221e; --surface-2: #2c2723; --ink: #efe6db; --muted: #a99c8f; --line: #3a332c;
  --heading: #eb93a3; --sun: #f0899a; --accent: #8fc2a6; --accent-soft: #2b3a31; --on-accent: #1c1916;
  --t-holiday: #f0899a; --t-personal: #82afe3; --t-work: #85c9a0; --t-birthday: #e8b062; --t-other: #bba0e6;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1c1916; --surface: #26221e; --surface-2: #2c2723; --ink: #efe6db; --muted: #a99c8f; --line: #3a332c;
  --heading: #eb93a3; --sun: #f0899a; --accent: #8fc2a6; --accent-soft: #2b3a31; --on-accent: #1c1916;
  --t-holiday: #f0899a; --t-personal: #82afe3; --t-work: #85c9a0; --t-birthday: #e8b062; --t-other: #bba0e6;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }   /* hidden elements stay hidden even where a class sets display */
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: #f3ede4; background: var(--bg); color: var(--ink); font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; font-family: var(--f-body); font-size: 14.5px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 44px }
.wrap { max-width: 1260px; margin: 0 auto; display: grid; gap: 18px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid #3f6b57; outline: 2px solid var(--accent); outline-offset: 2px }
.disp { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-family: var(--f-display); font-variation-settings: "SOFT" 100; }

/* ---------- header ---------- */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between }
.yearnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.yearnav h1 { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-family: var(--f-display); font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 34px; line-height: 1.1; margin: 0 4px; color: #9b2f45; color: var(--heading);
  font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; text-wrap: balance }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #e8ddcf; border: 1px solid var(--line); background: var(--surface); font-size: 19px; line-height: 1; box-shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07); box-shadow: var(--shadow) }
.iconbtn:hover { border-color: #7c7066; border-color: var(--muted) }
.seg { display: inline-flex; background: #f8f0e5; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 14px; font-weight: 600; font-size: 13px; color: #7c7066; color: var(--muted) }
.seg button[aria-pressed="true"] { background: #fffaf4; background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07); box-shadow: var(--shadow) }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid #e8ddcf; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 13px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: #7c7066; border-color: var(--muted) }
.btn.primary { background: #3f6b57; background: var(--accent); border-color: var(--accent); color: #fffaf4; color: var(--on-accent) }
.btn.armed { background: #b8324b; background: var(--sun); border-color: var(--sun); color: #fffaf4; color: var(--on-accent) }
select.btn { padding-right: 8px }
.yearnav .pick { margin-left: 4px }
.filebtn { position: relative }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none }
.filebtn:focus-within { outline: 2px solid #3f6b57; outline: 2px solid var(--accent); outline-offset: 2px }
.save-state { font-size: 12px; color: #7c7066; color: var(--muted) }
#fileBtn.linked { border-color: #3f8a5f; border-color: var(--t-work); color: var(--t-work) }
#fileBtn.attention { border-color: #b87314; border-color: var(--t-birthday); color: var(--t-birthday) }
.status { font-size: 13px; color: #7c7066; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center }
.merge { display: inline-flex; gap: 6px; align-items: center }
.srcchip { display: inline-flex; gap: 6px; align-items: center }
.srcchip i { width: 8px; height: 8px; border-radius: 50% }

.main { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 22px; align-items: start }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0,1fr) } }

/* ---------- year view: month cards ---------- */
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px }
.months.is-month { display: block }
.month { background: #fffaf4; background: var(--surface); border-radius: var(--r); box-shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07); box-shadow: var(--shadow); padding: 12px 14px 14px; min-width: 0;
  display: flex; flex-direction: column; align-items: center }
.month.is-now { box-shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07), inset 0 0 0 1.5px #e1ebe2; box-shadow: var(--shadow), inset 0 0 0 1.5px var(--accent-soft) }
.month h2 { margin: 0 0 6px; text-align: center }
.mtitle { border: 0; background: none; padding: 2px 10px; border-radius: 8px; font-family: "Fraunces", Georgia, "Times New Roman", serif; font-family: var(--f-display); font-variation-settings: "SOFT" 100;
  font-weight: 600; font-size: 19px; color: #9b2f45; color: var(--heading); display: inline-flex; align-items: baseline; gap: 6px }
.mtitle { position: relative }
.mtitle::after { content: "›"; position: absolute; left: 100%; font-size: 15px; opacity: 0; transform: translateX(-3px) }
.mtitle:hover { background: #f8f0e5; background: var(--surface-2) }
.mtitle:hover::after, .mtitle:focus-visible::after { opacity: .7; transform: none }
.month table { border-collapse: separate; border-spacing: 1px 2px; font-variant-numeric: tabular-nums; margin: 0 auto }
.month th { font-weight: 600; text-align: center; vertical-align: middle; width: 30px; padding: 0 4px 0 0; font-size: 12px; color: #7c7066; color: var(--muted); letter-spacing: .03em }
.month tr.sun th { color: #b8324b; color: var(--sun) }
.month td { padding: 0 }
.day { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border: 0; background: none; border-radius: 50%; font-size: 14px; font-weight: 500; padding: 0; text-align: center; font-variant-numeric: tabular-nums }
.pad { display: block; width: 30px; height: 30px }
.day:hover { background: #f8f0e5; background: var(--surface-2) }
tr.sun .day, .day.hol { color: #b8324b; color: var(--sun) }
.day.hol { font-weight: 800 }
.day.today { background: #3f6b57; background: var(--accent); color: var(--on-accent) }
.day.sel { box-shadow: 0 0 0 2px #3f6b57; box-shadow: 0 0 0 2px var(--accent) }
.day.today.sel { box-shadow: 0 0 0 2px #fffaf4, 0 0 0 4px #3f6b57; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent) }
.dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 2px; pointer-events: none }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor }
.day.today .dots i { background: #fffaf4 !important; background: var(--on-accent) !important }

/* ---------- month view ---------- */
.mview { background: #fffaf4; background: var(--surface); border-radius: calc(var(--r) + 4px); box-shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07); box-shadow: var(--shadow); padding: 14px }
.mv-wd, .mv-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.mv-wd { padding: 2px 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #7c7066; color: var(--muted) }
.mv-wd .sun { color: #b8324b; color: var(--sun) }
.mv-cell { min-height: 108px; min-width: 0; border: 1px solid #e8ddcf; border: 1px solid var(--line); border-radius: 12px; background: #fffaf4; background: var(--surface); text-align: left; padding: 6px 7px 7px;
  display: flex; flex-direction: column; gap: 4px; align-items: stretch }
.mv-cell:hover { border-color: #7c7066; border-color: var(--muted) }
.mv-cell.we { background: #f8f0e5; background: var(--surface-2) }
.mv-cell.out { opacity: .45 }
.mv-cell .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums }
.mv-cell.sun .num, .mv-cell.hol .num { color: #b8324b; color: var(--sun) }
.mv-cell.today .num { background: #3f6b57; background: var(--accent); color: var(--on-accent) }
.mv-cell.sel { border-color: #3f6b57; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.chip { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 6px; min-width: 0;
  background: color-mix(in srgb, var(--c) 15%, transparent) }
.chip::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip.is-hol { font-weight: 700; color: #b8324b; color: var(--sun) }
.more { font-size: 11px; color: #7c7066; color: var(--muted); padding-left: 4px }
@media (max-width: 680px) {
  .mview { padding: 8px }
  .mv-wd, .mv-grid { gap: 3px }
  .mv-cell { min-height: 60px; padding: 3px; border-radius: 9px; align-items: center }
  .mv-cell .num { width: 24px; height: 24px; font-size: 13px }
  .chip { width: 100%; height: 5px; padding: 0; font-size: 0; background: var(--c) }
  .chip::before, .more { display: none }
}

/* ---------- side panel ---------- */
aside { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
@media (max-width: 980px) { aside { position: static } }
.panel { background: #fffaf4; background: var(--surface); border-radius: var(--r); box-shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 12px; min-width: 0 }
.panel h3 { margin: 0; font-family: "Fraunces", Georgia, "Times New Roman", serif; font-family: var(--f-display); font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 21px; line-height: 1.2; text-wrap: balance }
.label { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: #7c7066; color: var(--muted) }
.evlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.ev { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 10px; align-items: start; background: #f8f0e5; background: var(--surface-2); border-radius: 10px; padding: 9px 10px }
.ev .bar { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: #7d5ba6; background: var(--t-other) }
.ev .t { font-weight: 700; overflow-wrap: anywhere }
.ev .n { color: #7c7066; color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.ev .meta { font-size: 12px; color: #7c7066; color: var(--muted) }
.hol-tag { font-size: 11px; font-weight: 800; letter-spacing: .03em; color: #b8324b; color: var(--t-holiday) }
.del { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #e8ddcf; border: 1px solid var(--line); background: var(--surface); color: #b8324b; color: var(--sun);
  font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; white-space: nowrap }
.del:hover { border-color: #b8324b; border-color: var(--sun) }
.del.armed { background: #b8324b; background: var(--sun); border-color: var(--sun); color: #fffaf4; color: var(--on-accent) }
.lock { color: #7c7066; color: var(--muted); padding: 4px 2px; display: inline-flex }
.empty { color: #7c7066; color: var(--muted); margin: 0 }
form { display: grid; gap: 9px }
.field { display: grid; gap: 4px }
.field label { font-size: 12px; color: #7c7066; color: var(--muted); font-weight: 600 }
.field input[type=text], .field select { width: 100%; border: 1px solid #e8ddcf; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: #f3ede4; background: var(--bg) }
.row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; padding-bottom: 9px }
.up { list-style: none; margin: 0; padding: 0; display: grid }
.up button { width: 100%; display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 10px; text-align: left; border: 0; background: none; padding: 7px 6px; border-radius: 9px }
.up button:hover { background: #f8f0e5; background: var(--surface-2) }
.up .d { font-variant-numeric: tabular-nums; color: #7c7066; color: var(--muted); font-size: 13px }
.up .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: #7c7066; color: var(--muted) }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.legend i { width: 8px; height: 8px; border-radius: 50% }

/* ---------- dialogs, drop zone, toast ---------- */
.overlay { position: fixed; inset: 0; background: rgb(30 20 10 / .45); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.overlay .panel { width: min(680px, 100%); max-height: 100%; overflow: auto }
.overlay textarea { width: 100%; min-height: 300px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; border: 1px solid #e8ddcf; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: #f3ede4; background: var(--bg); resize: vertical }
.help { font-size: 13px; color: #7c7066; color: var(--muted); margin: 0 }
.help code { font-size: 12px; background: #f3ede4; background: var(--bg); padding: 1px 4px; border-radius: 4px; color: #2f2925; color: var(--ink) }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
dialog { border: 0; padding: 0; background: none; width: min(580px, calc(100% - 32px)); color: #2f2925; color: var(--ink) }
dialog::backdrop { background: rgb(30 20 10 / .45) }
.file-rows { display: grid; gap: 10px }
.file-row { display: grid; gap: 6px; background: #f8f0e5; background: var(--surface-2); border-radius: 10px; padding: 10px 12px }
.file-row .label { display: flex; justify-content: space-between; gap: 8px }
.acts { display: flex; flex-wrap: wrap; gap: 8px }
#dropZone { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgb(30 20 10 / .35); pointer-events: none }
#dropZone > div { background: #fffaf4; background: var(--surface); border: 2px dashed var(--accent); border-radius: 16px; padding: 28px 36px; font-weight: 700; font-size: 17px; display: grid; gap: 4px; text-align: center }
#dropZone small { font-weight: 500; font-size: 13px; color: #7c7066; color: var(--muted) }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #2f2925; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: calc(100% - 32px); z-index: 40 }
#toast.show { opacity: 1; transform: translate(-50%, 0) }
#toast.has-act { pointer-events: auto; display: flex; align-items: center; gap: 12px }
.toast-act { border: 0; background: none; color: #e1ebe2; color: var(--accent-soft); font: inherit; font-weight: 800; text-decoration: underline; padding: 2px 4px; border-radius: 4px }
@media (prefers-reduced-motion: no-preference) {
  #toast { transition: opacity .2s, transform .2s }
  .day, .btn, .up button, .mv-cell, .mtitle::after, .seg button { transition: background .15s, border-color .15s, opacity .15s, transform .15s }
}

dialog { display: none; position: fixed; top: 0; left: 0; right: 0; margin: 40px auto; z-index: 25 }
dialog[open] { display: block }
.overlay, #dropZone { top: 0; right: 0; bottom: 0; left: 0 }
.chip { background: #f8f0e5 }
@supports (background: color-mix(in srgb, red 15%, transparent)) { .chip { background: color-mix(in srgb, var(--c) 15%, transparent) } }
.nogrid .main > section, .nogrid aside { display: block; margin-bottom: 18px }
.nogrid .months { display: block; text-align: center; font-size: 0 }
.nogrid .month { display: inline-block; vertical-align: top; width: 252px; margin: 6px; font-size: 14.5px; text-align: left }
.nogrid .months.is-month { font-size: 14.5px }
.nogrid .mv-wd, .nogrid .mv-grid { display: block; font-size: 0 }
.nogrid .mv-wd > div { display: inline-block; width: 14.28%; font-size: 12px; text-align: center }
.nogrid .mv-cell { display: inline-block; vertical-align: top; width: 13.6%; margin: 0.34%; font-size: 13px; overflow: hidden }
.nogrid .mv-cell > * { display: block; margin-bottom: 3px }
.nogrid .wrap > *, .nogrid .panel > *, .nogrid form > *, .nogrid .file-rows > *, .nogrid .file-row > * { margin-bottom: 10px }
.nogrid .ev { display: table; width: 100%; margin-bottom: 8px }
.nogrid .ev > * { display: table-cell; vertical-align: top; padding-right: 8px }
.nogrid .ev .bar { display: inline-block; width: 10px }
.nogrid .up button { display: block }
.nogrid .up .d { display: inline-block; width: 64px }
.nogrid .day, .nogrid .mv-cell .num { text-align: center; line-height: 30px }
.nogrid .tools > *, .nogrid .yearnav > * { margin: 3px }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="yearnav">
      <button class="iconbtn" id="prevY" data-i18n-aria="prevYear" aria-label="Previous year">‹</button>
      <h1 id="yearLbl">2026</h1>
      <button class="iconbtn" id="nextY" data-i18n-aria="nextYear" aria-label="Next year">›</button>
      <button class="btn" id="todayBtn" style="margin-left:4px" data-i18n="today">Today</button>
      <div class="seg" role="group" data-i18n-aria="view" aria-label="View">
        <button type="button" id="vYear" aria-pressed="true" data-i18n="viewYear">Year</button>
        <button type="button" id="vMonth" aria-pressed="false" data-i18n="viewMonth">Month</button>
      </div>
      <select class="btn pick" id="lang" data-i18n-aria="language" aria-label="Language"></select>
      <select class="btn pick" id="holSel" data-i18n-aria="holidaysSel" data-i18n-title="holidaysSel" aria-label="Public holidays"></select>
      <select class="btn pick" id="palette" data-i18n-aria="palette" data-i18n-title="palette" aria-label="Colours"></select>
    </div>
    <div class="tools">
      <span class="save-state" id="saveState"></span>
      <button class="btn primary" id="saveNow">Save</button>
      <button class="btn fs-only" id="saveAs" data-i18n="saveAs" data-i18n-title="saveAsTitle">Save as…</button>
      <button class="btn" id="fileBtn">Data files…</button>
      <label class="btn filebtn"><span data-i18n="importEvents">Import events…</span><input type="file" id="fileIn" accept=".json,application/json"></label>
      <button class="btn" id="exportJson" data-i18n="exportBackup">Export backup</button>
      <button class="btn" id="exportBtn" data-i18n="viewJson">View / copy JSON</button>
    </div>
  </header>
  <div class="status">
    <span class="srcchip"><i style="background:#3a6ea5;background:var(--t-personal)"></i><span id="evInfo"></span></span>
    <span class="srcchip"><i style="background:#b8324b;background:var(--t-holiday)"></i><span id="holInfoShort"></span></span>
    <label class="merge"><input type="checkbox" id="mergeChk" checked> <span data-i18n="mergeLabel">Import adds to current events (untick to replace)</span></label>
    <span data-i18n="dropTip">Tip: drop .json files anywhere to add their events.</span>
  </div>

  <div class="main">
    <section class="months" id="months" data-i18n-aria="yearCalendar" aria-label="Year calendar"></section>
    <aside>
      <div class="panel" id="dayPanel">
        <div class="label" data-i18n="selectedDay">Selected day</div>
        <h3 id="dayTitle"></h3>
        <ul class="evlist" id="dayEvents"></ul>
        <form id="addForm" autocomplete="off">
          <div class="label" data-i18n="addEvent">Add event</div>
          <div class="field"><label for="fTitle" data-i18n="title">Title</label><input type="text" id="fTitle" required maxlength="120" data-i18n-ph="titlePh"></div>
          <div class="field"><label for="fNote" data-i18n="note">Note (optional)</label><input type="text" id="fNote" maxlength="200"></div>
          <div class="row2">
            <div class="field"><label for="fType" data-i18n="type">Type</label>
              <select id="fType">
                <option value="personal" data-i18n="type_personal">Personal</option>
                <option value="work" data-i18n="type_work">Work</option>
                <option value="birthday" data-i18n="type_birthday">Birthday</option>
                <option value="holiday" data-i18n="type_holiday">Holiday</option>
                <option value="other" data-i18n="type_other">Other</option>
              </select></div>
            <label class="check"><input type="checkbox" id="fRepeat"> <span data-i18n="everyYear">Every year</span></label>
          </div>
          <button class="btn primary" type="submit" data-i18n="addToDay">Add to this day</button>
        </form>
      </div>
      <div class="panel">
        <div class="label" data-i18n="comingUp">Coming up</div>
        <ul class="up" id="upcoming"></ul>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </div>
</div>

<div class="overlay" id="exportDlg" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <h3 id="expTitle" data-i18n="exportTitle">Events JSON</h3>
    <p class="help" data-i18n-html="exportHelpHtml"></p>
    <textarea id="expText" readonly spellcheck="false"></textarea>
    <div class="actions">
      <span id="copyMsg" class="help" style="align-self:center"></span>
      <button class="btn" id="copyBtn" data-i18n="copy">Copy</button>
      <button class="btn primary" id="closeExp" data-i18n="close">Close</button>
    </div>
  </div>
</div>

<dialog id="fileDlg">
  <div class="panel">
    <h3 data-i18n="dataFilesTitle">Data files</h3>
    <p class="help" id="fsNote"></p>
    <div class="file-rows">
      <div class="file-row">
        <div class="label"><span data-i18n="eventsFile">Events file</span><span id="evState"></span></div>
        <p class="help" id="fileInfo"></p>
        <div class="acts fs-only" id="fileLinked">
          <button class="btn primary" type="button" id="fileLoad" data-i18n="loadFromFile">Load from file</button>
          <button class="btn" type="button" id="fileSave" data-i18n="saveToFileNow">Save to file now</button>
          <button class="btn" type="button" id="fileUnlink" data-i18n="stopUsingFile">Stop using this file</button>
        </div>
        <div class="acts fs-only">
          <button class="btn" type="button" id="fileOpen" data-i18n="openEventsFile">Open an events file…</button>
          <button class="btn" type="button" id="fileCreate" data-i18n="saveEventsAs">Save events as…</button>
        </div>
      </div>
      <div id="srcRows" class="file-rows"></div>
    </div>
    <p class="help" data-i18n="dataFilesHelp"></p>
    <div class="actions"><button class="btn" type="button" id="fileClose" data-i18n="close">Close</button></div>
  </div>
</dialog>

<dialog id="askDlg">
  <div class="panel">
    <h3 id="askTitle"></h3>
    <p class="help" id="askText"></p>
    <div class="actions">
      <button class="btn" type="button" id="askNo"></button>
      <button class="btn primary" type="button" id="askYes"></button>
    </div>
  </div>
</dialog>

<div id="dropZone" hidden><div><span data-i18n="dropTitle">Drop to add events</span><small data-i18n="dropSub">Nothing in the calendar is removed</small></div></div>
<div id="toast" role="status" aria-live="polite"></div>
