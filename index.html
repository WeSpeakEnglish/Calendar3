<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year Calendar CZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: cosy wall calendar. Year view = soft month cards (weekdays as rows, weeks as columns);
   month view = classic 7-column grid with event chips. Side panel for the selected day. */
:root {
  --bg: #f3ede4; --surface: #fffaf4; --surface-2: #f8f0e5; --ink: #2f2925; --muted: #7c7066; --line: #e8ddcf;
  --heading: #9b2f45; --sun: #b8324b; --accent: #3f6b57; --accent-soft: #e1ebe2; --on-accent: #fffaf4;
  --t-holiday: #b8324b; --t-personal: #3a6ea5; --t-work: #3f8a5f; --t-birthday: #b87314; --t-other: #7d5ba6;
  --shadow: 0 1px 2px rgb(70 45 20 / .05), 0 6px 18px rgb(70 45 20 / .07);
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1916; --surface: #26221e; --surface-2: #2c2723; --ink: #efe6db; --muted: #a99c8f; --line: #3a332c;
  --heading: #eb93a3; --sun: #f0899a; --accent: #8fc2a6; --accent-soft: #2b3a31; --on-accent: #1c1916;
  --t-holiday: #f0899a; --t-personal: #82afe3; --t-work: #85c9a0; --t-birthday: #e8b062; --t-other: #bba0e6;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1c1916; --surface: #26221e; --surface-2: #2c2723; --ink: #efe6db; --muted: #a99c8f; --line: #3a332c;
  --heading: #eb93a3; --sun: #f0899a; --accent: #8fc2a6; --accent-soft: #2b3a31; --on-accent: #1c1916;
  --t-holiday: #f0899a; --t-personal: #82afe3; --t-work: #85c9a0; --t-birthday: #e8b062; --t-other: #bba0e6;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }   /* hidden elements stay hidden even where a class sets display */
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 44px }
.wrap { max-width: 1260px; margin: 0 auto; display: grid; gap: 18px }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.disp { font-family: var(--f-display); font-variation-settings: "SOFT" 100; }

/* ---------- header ---------- */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between }
.yearnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.yearnav h1 { font-family: var(--f-display); font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 34px; line-height: 1.1; margin: 0 4px; color: var(--heading);
  font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; text-wrap: balance }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 19px; line-height: 1; box-shadow: var(--shadow) }
.iconbtn:hover { border-color: var(--muted) }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 14px; font-weight: 600; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 13px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.armed { background: var(--sun); border-color: var(--sun); color: var(--on-accent) }
select.btn { padding-right: 8px }
.yearnav .pick { margin-left: 4px }
.filebtn { position: relative }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
.save-state { font-size: 12px; color: var(--muted) }
#fileBtn.linked { border-color: var(--t-work); color: var(--t-work) }
#fileBtn.attention { border-color: var(--t-birthday); color: var(--t-birthday) }
.status { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center }
.merge { display: inline-flex; gap: 6px; align-items: center }
.srcchip { display: inline-flex; gap: 6px; align-items: center }
.srcchip i { width: 8px; height: 8px; border-radius: 50% }

.main { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 22px; align-items: start }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0,1fr) } }

/* ---------- year view: month cards ---------- */
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px }
.months.is-month { display: block }
.month { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px 14px; min-width: 0;
  display: flex; flex-direction: column; align-items: center }
.month.is-now { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--accent-soft) }
.month h2 { margin: 0 0 6px; text-align: center }
.mtitle { border: 0; background: none; padding: 2px 10px; border-radius: 8px; font-family: var(--f-display); font-variation-settings: "SOFT" 100;
  font-weight: 600; font-size: 19px; color: var(--heading); display: inline-flex; align-items: baseline; gap: 6px }
.mtitle { position: relative }
.mtitle::after { content: "›"; position: absolute; left: 100%; font-size: 15px; opacity: 0; transform: translateX(-3px) }
.mtitle:hover { background: var(--surface-2) }
.mtitle:hover::after, .mtitle:focus-visible::after { opacity: .7; transform: none }
.month table { border-collapse: separate; border-spacing: 1px 2px; font-variant-numeric: tabular-nums; margin: 0 auto }
.month th { font-weight: 600; text-align: center; vertical-align: middle; width: 30px; padding: 0 4px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .03em }
.month tr.sun th { color: var(--sun) }
.month td { padding: 0 }
.day { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border: 0; background: none; border-radius: 50%; font-size: 14px; font-weight: 500; padding: 0; text-align: center; font-variant-numeric: tabular-nums }
.pad { display: block; width: 30px; height: 30px }
.day:hover { background: var(--surface-2) }
tr.sun .day, .day.hol { color: var(--sun) }
.day.hol { font-weight: 800 }
.day.today { background: var(--accent); color: var(--on-accent) }
.day.sel { box-shadow: 0 0 0 2px var(--accent) }
.day.today.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent) }
.dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 2px; pointer-events: none }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor }
.day.today .dots i { background: var(--on-accent) !important }

/* ---------- month view ---------- */
.mview { background: var(--surface); border-radius: calc(var(--r) + 4px); box-shadow: var(--shadow); padding: 14px }
.mv-wd, .mv-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.mv-wd { padding: 2px 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.mv-wd .sun { color: var(--sun) }
.mv-cell { min-height: 108px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; padding: 6px 7px 7px;
  display: flex; flex-direction: column; gap: 4px; align-items: stretch }
.mv-cell:hover { border-color: var(--muted) }
.mv-cell.we { background: var(--surface-2) }
.mv-cell.out { opacity: .45 }
.mv-cell .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums }
.mv-cell.sun .num, .mv-cell.hol .num { color: var(--sun) }
.mv-cell.today .num { background: var(--accent); color: var(--on-accent) }
.mv-cell.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.chip { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 6px; min-width: 0;
  background: color-mix(in srgb, var(--c) 15%, transparent) }
.chip::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip.is-hol { font-weight: 700; color: var(--sun) }
.more { font-size: 11px; color: var(--muted); padding-left: 4px }
@media (max-width: 680px) {
  .mview { padding: 8px }
  .mv-wd, .mv-grid { gap: 3px }
  .mv-cell { min-height: 60px; padding: 3px; border-radius: 9px; align-items: center }
  .mv-cell .num { width: 24px; height: 24px; font-size: 13px }
  .chip { width: 100%; height: 5px; padding: 0; font-size: 0; background: var(--c) }
  .chip::before, .more { display: none }
}

/* ---------- side panel ---------- */
aside { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
@media (max-width: 980px) { aside { position: static } }
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 12px; min-width: 0 }
.panel h3 { margin: 0; font-family: var(--f-display); font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 21px; line-height: 1.2; text-wrap: balance }
.label { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.evlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.ev { display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 10px; align-items: start; background: var(--surface-2); border-radius: 10px; padding: 9px 10px }
.ev .bar { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--t-other) }
.ev .t { font-weight: 700; overflow-wrap: anywhere }
.ev .n { color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.ev .meta { font-size: 12px; color: var(--muted) }
.hol-tag { font-size: 11px; font-weight: 800; letter-spacing: .03em; color: var(--t-holiday) }
.del { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--sun);
  font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; white-space: nowrap }
.del:hover { border-color: var(--sun) }
.del.armed { background: var(--sun); border-color: var(--sun); color: var(--on-accent) }
.lock { color: var(--muted); padding: 4px 2px; display: inline-flex }
.empty { color: var(--muted); margin: 0 }
form { display: grid; gap: 9px }
.field { display: grid; gap: 4px }
.field label { font-size: 12px; color: var(--muted); font-weight: 600 }
.field input[type=text], .field select { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--bg) }
.row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; padding-bottom: 9px }
.up { list-style: none; margin: 0; padding: 0; display: grid }
.up button { width: 100%; display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 10px; text-align: left; border: 0; background: none; padding: 7px 6px; border-radius: 9px }
.up button:hover { background: var(--surface-2) }
.up .d { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px }
.up .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.legend i { width: 8px; height: 8px; border-radius: 50% }

/* ---------- dialogs, drop zone, toast ---------- */
.overlay { position: fixed; inset: 0; background: rgb(30 20 10 / .45); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.overlay .panel { width: min(680px, 100%); max-height: 100%; overflow: auto }
.overlay textarea { width: 100%; min-height: 300px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--bg); resize: vertical }
.help { font-size: 13px; color: var(--muted); margin: 0 }
.help code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 4px; color: var(--ink) }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
dialog { border: 0; padding: 0; background: none; width: min(580px, calc(100% - 32px)); color: var(--ink) }
dialog::backdrop { background: rgb(30 20 10 / .45) }
.file-rows { display: grid; gap: 10px }
.file-row { display: grid; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px }
.file-row .label { display: flex; justify-content: space-between; gap: 8px }
.acts { display: flex; flex-wrap: wrap; gap: 8px }
#dropZone { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgb(30 20 10 / .35); pointer-events: none }
#dropZone > div { background: var(--surface); border: 2px dashed var(--accent); border-radius: 16px; padding: 28px 36px; font-weight: 700; font-size: 17px; display: grid; gap: 4px; text-align: center }
#dropZone small { font-weight: 500; font-size: 13px; color: var(--muted) }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: calc(100% - 32px); z-index: 40 }
#toast.show { opacity: 1; transform: translate(-50%, 0) }
#toast.has-act { pointer-events: auto; display: flex; align-items: center; gap: 12px }
.toast-act { border: 0; background: none; color: var(--accent-soft); font: inherit; font-weight: 800; text-decoration: underline; padding: 2px 4px; border-radius: 4px }
@media (prefers-reduced-motion: no-preference) {
  #toast { transition: opacity .2s, transform .2s }
  .day, .btn, .up button, .mv-cell, .mtitle::after, .seg button { transition: background .15s, border-color .15s, opacity .15s, transform .15s }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="yearnav">
      <button class="iconbtn" id="prevY" data-i18n-aria="prevYear" aria-label="Previous year">‹</button>
      <h1 id="yearLbl">2026</h1>
      <button class="iconbtn" id="nextY" data-i18n-aria="nextYear" aria-label="Next year">›</button>
      <button class="btn" id="todayBtn" style="margin-left:4px" data-i18n="today">Today</button>
      <div class="seg" role="group" data-i18n-aria="view" aria-label="View">
        <button type="button" id="vYear" aria-pressed="true" data-i18n="viewYear">Year</button>
        <button type="button" id="vMonth" aria-pressed="false" data-i18n="viewMonth">Month</button>
      </div>
      <select class="btn pick" id="lang" data-i18n-aria="language" aria-label="Language"></select>
      <select class="btn pick" id="holSel" data-i18n-aria="holidaysSel" data-i18n-title="holidaysSel" aria-label="Public holidays"></select>
      <select class="btn pick" id="palette" data-i18n-aria="palette" data-i18n-title="palette" aria-label="Colours"></select>
    </div>
    <div class="tools">
      <span class="save-state" id="saveState"></span>
      <button class="btn primary" id="saveNow">Save</button>
      <button class="btn fs-only" id="saveAs" data-i18n="saveAs" data-i18n-title="saveAsTitle">Save as…</button>
      <button class="btn" id="fileBtn">Data files…</button>
      <label class="btn filebtn"><span data-i18n="importEvents">Import events…</span><input type="file" id="fileIn" accept=".json,application/json"></label>
      <button class="btn" id="exportJson" data-i18n="exportBackup">Export backup</button>
      <button class="btn" id="exportBtn" data-i18n="viewJson">View / copy JSON</button>
    </div>
  </header>
  <div class="status">
    <span class="srcchip"><i style="background:var(--t-personal)"></i><span id="evInfo"></span></span>
    <span class="srcchip"><i style="background:var(--t-holiday)"></i><span id="holInfoShort"></span></span>
    <label class="merge"><input type="checkbox" id="mergeChk" checked> <span data-i18n="mergeLabel">Import adds to current events (untick to replace)</span></label>
    <span data-i18n="dropTip">Tip: drop .json files anywhere to add their events.</span>
  </div>

  <div class="main">
    <section class="months" id="months" data-i18n-aria="yearCalendar" aria-label="Year calendar"></section>
    <aside>
      <div class="panel" id="dayPanel">
        <div class="label" data-i18n="selectedDay">Selected day</div>
        <h3 id="dayTitle"></h3>
        <ul class="evlist" id="dayEvents"></ul>
        <form id="addForm" autocomplete="off">
          <div class="label" data-i18n="addEvent">Add event</div>
          <div class="field"><label for="fTitle" data-i18n="title">Title</label><input type="text" id="fTitle" required maxlength="120" data-i18n-ph="titlePh"></div>
          <div class="field"><label for="fNote" data-i18n="note">Note (optional)</label><input type="text" id="fNote" maxlength="200"></div>
          <div class="row2">
            <div class="field"><label for="fType" data-i18n="type">Type</label>
              <select id="fType">
                <option value="personal" data-i18n="type_personal">Personal</option>
                <option value="work" data-i18n="type_work">Work</option>
                <option value="birthday" data-i18n="type_birthday">Birthday</option>
                <option value="holiday" data-i18n="type_holiday">Holiday</option>
                <option value="other" data-i18n="type_other">Other</option>
              </select></div>
            <label class="check"><input type="checkbox" id="fRepeat"> <span data-i18n="everyYear">Every year</span></label>
          </div>
          <button class="btn primary" type="submit" data-i18n="addToDay">Add to this day</button>
        </form>
      </div>
      <div class="panel">
        <div class="label" data-i18n="comingUp">Coming up</div>
        <ul class="up" id="upcoming"></ul>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </div>
</div>

<div class="overlay" id="exportDlg" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <h3 id="expTitle" data-i18n="exportTitle">Events JSON</h3>
    <p class="help" data-i18n-html="exportHelpHtml"></p>
    <textarea id="expText" readonly spellcheck="false"></textarea>
    <div class="actions">
      <span id="copyMsg" class="help" style="align-self:center"></span>
      <button class="btn" id="copyBtn" data-i18n="copy">Copy</button>
      <button class="btn primary" id="closeExp" data-i18n="close">Close</button>
    </div>
  </div>
</div>

<dialog id="fileDlg">
  <div class="panel">
    <h3 data-i18n="dataFilesTitle">Data files</h3>
    <p class="help" id="fsNote"></p>
    <div class="file-rows">
      <div class="file-row">
        <div class="label"><span data-i18n="eventsFile">Events file</span><span id="evState"></span></div>
        <p class="help" id="fileInfo"></p>
        <div class="acts fs-only" id="fileLinked">
          <button class="btn primary" type="button" id="fileLoad" data-i18n="loadFromFile">Load from file</button>
          <button class="btn" type="button" id="fileSave" data-i18n="saveToFileNow">Save to file now</button>
          <button class="btn" type="button" id="fileUnlink" data-i18n="stopUsingFile">Stop using this file</button>
        </div>
        <div class="acts fs-only">
          <button class="btn" type="button" id="fileOpen" data-i18n="openEventsFile">Open an events file…</button>
          <button class="btn" type="button" id="fileCreate" data-i18n="saveEventsAs">Save events as…</button>
        </div>
      </div>
      <div id="srcRows" class="file-rows"></div>
    </div>
    <p class="help" data-i18n="dataFilesHelp"></p>
    <div class="actions"><button class="btn" type="button" id="fileClose" data-i18n="close">Close</button></div>
  </div>
</dialog>

<dialog id="askDlg">
  <div class="panel">
    <h3 id="askTitle"></h3>
    <p class="help" id="askText"></p>
    <div class="actions">
      <button class="btn" type="button" id="askNo"></button>
      <button class="btn primary" type="button" id="askYes"></button>
    </div>
  </div>
</dialog>

<div id="dropZone" hidden><div><span data-i18n="dropTitle">Drop to add events</span><small data-i18n="dropSub">Nothing in the calendar is removed</small></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

  const isMonth = view === "month", T = L();
  $("months").classList.toggle("is-month", isMonth);
  $("yearLbl").textContent = isMonth ? `${T.months[month]} ${year}` : year;
  $("vYear").setAttribute("aria-pressed", !isMonth); $("vMonth").setAttribute("aria-pressed", isMonth);
  $("prevY").setAttribute("aria-label", t(isMonth ? "prevMonth" : "prevYear"));
  $("nextY").setAttribute("aria-label", t(isMonth ? "nextMonth" : "nextYear"));
  if (isMonth) return renderMonthView();
  const map = expand(year);
  let html = "";
  for (let m = 0; m < 12; m++) {
    const off = (new Date(Date.UTC(year, m, 1)).getUTCDay() + 6) % 7;
    const days = new Date(Date.UTC(year, m + 1, 0)).getUTCDate();
    const cols = 6;   /* always six week columns, so every month card has the same grid */
    const isNow = year === now.getFullYear() && m === now.getMonth();
    html += `<div class="month${isNow ? " is-now" : ""}"><h2><button class="mtitle" data-month="${m}" title="${esc(t("openMonth", { month: T.months[m] }))}">${esc(T.months[m])}</button></h2><table><tbody>`;
    for (let r = 0; r < 7; r++) {
      html += `<tr${r === 6 ? ' class="sun"' : ""}><th scope="row">${esc(T.weekdays[r])}</th>`;
      for (let c = 0; c < cols; c++) {
        const d = c * 7 + r - off + 1;
        if (d < 1 || d > days) { html += '<td><span class="pad" aria-hidden="true"></span></td>'; continue; }
        const key = iso(year, m, d), evs = map[key] || [];
        const cls = ["day"];
        if (evs.some(e => e.type === "holiday")) cls.push("hol");
        if (key === TODAY) cls.push("today");
        if (key === selected) cls.push("sel");
        const dots = evs.filter(e => e.type !== "holiday").slice(0, 3).map(e => `<i style="background:var(--t-${e.type})"></i>`).join("");
        const tip = evs.map(e => e.title).join(" · ");
        html += `<td><button class="${cls.join(" ")}" data-d="${key}"${tip ? ` title="${esc(tip)}"` : ""} aria-label="${key}${tip ? ": " + esc(tip) : ""}">${d}${dots ? `<span class="dots">${dots}</span>` : ""}</button></td>`;
      }
      html += "</tr>";
    }
    html += "</tbody></table></div>";
  }
  $("months").innerHTML = html;
}
/* Month view: classic grid, Monday first, with the neighbouring months' days faded */
function renderMonthView() {
  const T = L(), off = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  const weeks = Math.ceil((off + days) / 7);
  let html = `<div class="mview"><div class="mv-wd">${T.weekdays.map((w, i) => `<div${i === 6 ? ' class="sun"' : ""}>${esc(w)}</div>`).join("")}</div><div class="mv-grid">`;
  for (let i = 0; i < weeks * 7; i++) {
    const dt = new Date(Date.UTC(year, month, i - off + 1));
    const key = iso(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    const evs = [...eventsOn(key)].sort((a, b) => isHol(b) - isHol(a)), col = i % 7;
    const cls = ["mv-cell"];
    if (dt.getUTCMonth() !== month) cls.push("out");
    if (col >= 5) cls.push("we");
    if (col === 6) cls.push("sun");
    if (evs.some(e => e.type === "holiday")) cls.push("hol");
    if (key === TODAY) cls.push("today");
    if (key === selected) cls.push("sel");
    const shown = evs.slice(0, 3), extra = evs.length - shown.length;
    const tip = evs.map(e => e.title).join(" · ");
    html += `<button class="${cls.join(" ")}" data-d="${key}"${tip ? ` title="${esc(tip)}"` : ""} aria-label="${key}${tip ? ": " + esc(tip) : ""}">
      <span class="num">${dt.getUTCDate()}</span>
      ${shown.map(e => `<span class="chip${e.type === "holiday" ? " is-hol" : ""}" style="--c:var(--t-${e.type})"><span>${esc(e.title)}</span></span>`).join("")}
      ${extra > 0 ? `<span class="more">${esc(t("more", { n: extra }))}</span>` : ""}</button>`;
  }
  $("months").innerHTML = html + "</div></div>";
}
function fmt(d, opts) { const [y, m, dd] = d.split("-").map(Number); try { return new Intl.DateTimeFormat(L().locale, { timeZone: "UTC", ...opts }).format(new Date(Date.UTC(y, m - 1, dd))); } catch { return d; } }
function rule(e) {
  if (e.weekday) return t("ruleNth");
  if (Number.isInteger(e.easter)) return e.easter === 0 ? t("ruleEaster") : t("ruleEasterOffset", { offset: (e.easter > 0 ? "+" : "−") + Math.abs(e.easter) });
  return e.date.length === 5 ? t("ruleYearly") : t("ruleOnce");
}
function renderDay() {
  const s = fmt(selected, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("dayTitle").textContent = s.charAt(0).toUpperCase() + s.slice(1);
  const evs = [...eventsOn(selected)].sort((a, b) => isHol(b) - isHol(a));
  $("dayEvents").innerHTML = evs.length ? evs.map(e => `
    <li class="ev"><span class="bar" style="background:var(--t-${e.type})"></span>
      <div><div class="t">${esc(e.title)}</div>${e.note ? `<div class="n">${esc(e.note)}</div>` : ""}<div class="meta">${isHol(e) ? `<span class="hol-tag">${esc(nameOf(hol().name))}</span>` : esc(t("type_" + e.type))} · ${esc(rule(e))}</div></div>
      ${isHol(e) ? `<span class="lock" title="${esc(t("holidayReadOnly"))}" aria-label="${esc(t("holidayReadOnly"))}">${LOCK}</span>`
        : `<button class="del" data-del="${esc(e.id)}" aria-label="${esc(t("delete"))}: ${esc(e.title)}">${BIN}<span>${esc(t("delete"))}</span></button>`}</li>`).join("")
    : `<li class="empty">${esc(t("noEvents"))}</li>`;
}
function renderUpcoming() {
  const items = [];
  [now.getFullYear(), now.getFullYear() + 1].forEach(y => Object.entries(expand(y)).forEach(([d, list]) => { if (d >= TODAY) list.forEach(e => items.push([d, e])); }));
  items.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  $("upcoming").innerHTML = items.slice(0, 8).map(([d, e]) => `<li><button data-go="${d}"><span class="d">${esc(fmt(d, { day: "numeric", month: "short" }))}</span><span class="t" title="${esc(e.title)}"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--t-${e.type})"></i>${esc(e.title)}</span></button></li>`).join("") || `<li class="empty">${esc(t("nothingScheduled"))}</li>`;
}
function renderInfo() {
  $("evInfo").textContent = t("evCount", { n: cal.events.length }) + (fileHandle ? ` · ${fileHandle.name}` : "");
  const h = SRC.hol;
  $("holInfoShort").textContent = !holKey ? t("noHolidays")
    : t("holCount", { n: hol().events.length, name: nameOf(hol().name) }) + (h.handle ? ` (${h.handle.name})` : h.source === "built-in" ? ` (${t("builtIn")})` : "");
}
function render() { renderMonths(); renderDay(); renderUpcoming(); renderInfo(); }
function rerenderAll() { applyI18n(); render(); updateFileUI(); if (saveStateKey) setSaveState(saveStateKey, saveStateVars); }

/* ---------- persistence (same model as the change board) ----------
   Inside Claude the calendar uses Claude's artifact storage. Opened as a local file or from a server, it keeps
   its data in this browser's local storage, and (Edge/Chrome) can also use linked .json files on your disk. */
const hasStorage = typeof window.storage !== "undefined";
const LOCAL = (() => {
  if (hasStorage) return null;
  try { const k = "__cal_test"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return window.localStorage; }
  catch { return null; }
})();
const packAll = () => JSON.stringify({ ...evSnapshot(),
  holidays: { ...SRC.hol.data, source: SRC.hol.source },
  translations: { data: SRC.tr.data, source: SRC.tr.source },
  theme: { data: SRC.th.data, source: SRC.th.source } });
function unpackAll(v) {
  if (!v || !Array.isArray(v.events)) return false;
  if (v.holidays && (v.holidays.sets || Array.isArray(v.holidays.events))) {
    cal = { name: v.name, description: v.description, events: v.events };
    try { SRC.hol.data = toHol(v.holidays).data; SRC.hol.source = v.holidays.source || "stored"; } catch {}
  } else {   /* older version kept holidays among the events: move them out */
    cal = { name: "My events", events: v.events.filter(e => !/^cz-/.test(e.id || "")) };
  }
  if (v.translations?.data) { try { SRC.tr.data = toTr(v.translations.data); SRC.tr.source = v.translations.source || "stored"; } catch {} }
  if (v.theme?.data) { try { SRC.th.data = toTheme(v.theme.data); SRC.th.source = v.theme.source || "stored"; } catch {} }
  return true;
}
async function load() {
  if (hasStorage) {
    try { const r = await window.storage.get(KEY, false); if (r && r.value && unpackAll(JSON.parse(r.value))) { setSaveState("stateSaved"); return true; } } catch (e) {}
    setSaveState("stateSaved"); return false;
  }
  if (LOCAL) {
    let ok = false; try { ok = unpackAll(JSON.parse(LOCAL.getItem(KEY) || "null")); } catch {}
    setSaveState("stateSavedBrowser"); return ok;
  }
  setSaveState("stateNoAuto"); return false;
}
async function persist() {
  if (hasStorage) {
    try { setSaveState("stateSaving"); const r = await window.storage.set(KEY, packAll(), false); setSaveState(r ? "stateSaved" : "stateSaveFailed"); }
    catch (e) { setSaveState("stateSaveFailed"); }
    return;
  }
  if (LOCAL) { try { LOCAL.setItem(KEY, packAll()); if (!fileHandle) setSaveState("stateSavedBrowser"); } catch { setSaveState("stateSaveFailed"); } }
}
/* events changed */
async function save() { invalidate(); render(); await persist(); fileChanged(); }
/* a read-only file changed (holidays or translations); never written to any file */
async function saveSrc(k) {
  if (k === "tr") buildLangSelect();
  if (k === "hol") buildHolSelect();
  if (k === "th") { buildPaletteSelect(); applyTheme(); }
  invalidate(); rerenderAll(); await persist();
}

/* In-page yes/no dialog (works where confirm() is blocked). Resolves true / false / null (closed). */
function ask(title, text, yes, no) {
  return new Promise(res => {
    const d = $("askDlg");
    $("askTitle").textContent = title; $("askText").textContent = text; $("askYes").textContent = yes; $("askNo").textContent = no;
    const done = v => { if (d.open) d.close(); $("askYes").onclick = $("askNo").onclick = d.oncancel = null; res(v); };
    $("askYes").onclick = () => done(true); $("askNo").onclick = () => done(false); d.oncancel = e => { e.preventDefault(); done(null); };
    d.showModal(); $("askYes").focus();
  });
}
function download(name, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- interactions ---------- */
const goTo = d => { selected = d; year = +d.slice(0, 4); month = +d.slice(5, 7) - 1; renderMonths(); renderDay(); };
$("months").addEventListener("click", e => {
  const mt = e.target.closest("[data-month]");
  if (mt) { month = +mt.dataset.month; view = "month"; renderMonths(); return; }
  const b = e.target.closest("[data-d]"); if (!b) return;
  if (view === "month" && b.classList.contains("out")) return goTo(b.dataset.d);   // a faded day from the next/previous month
  selected = b.dataset.d; renderMonths(); renderDay();
});
$("upcoming").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) goTo(b.dataset.go); });
const step = dir => {
  if (view === "month") { month += dir; if (month < 0) { month = 11; year--; } if (month > 11) { month = 0; year++; } }
  else year += dir;
  renderMonths();
};
$("prevY").onclick = () => step(-1);
$("nextY").onclick = () => step(1);
$("todayBtn").onclick = () => goTo(TODAY);
$("vYear").onclick = () => { view = "year"; renderMonths(); };
$("vMonth").onclick = () => { view = "month"; if (+selected.slice(0, 4) === year) month = +selected.slice(5, 7) - 1; renderMonths(); };
$("lang").onchange = e => { lang = e.target.value; store(KEY + "-lang", lang); buildHolSelect(); invalidate(); rerenderAll(); };
$("holSel").onchange = e => { holKey = e.target.value; store(KEY + "-holset", holKey); invalidate(); render(); };
$("palette").onchange = e => { palette = e.target.value; store(KEY + "-palette", palette); applyTheme(); };
/* Delete: first click arms the button ("Delete?"), second click deletes. The message offers Undo. */
$("dayEvents").addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.querySelector("span").textContent = t("deleteConfirm");
    setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.querySelector("span").textContent = t("delete"); } }, 3000);
    return;
  }
  const idx = cal.events.findIndex(x => x.id === b.dataset.del); if (idx < 0) return;
  const [gone] = cal.events.splice(idx, 1); save();
  toast(t("tDeleted", { title: gone.title }), t("undo"), () => {
    if (cal.events.some(x => x.id === gone.id)) return;
    cal.events.splice(Math.min(idx, cal.events.length), 0, gone); save();
    toast(t("tRestored", { title: gone.title }));
  });
});
$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const title = $("fTitle").value.trim(); if (!title) return;
  const ev = { id: "ev-" + Date.now().toString(36), date: $("fRepeat").checked ? selected.slice(5) : selected, title, type: $("fType").value };
  const note = $("fNote").value.trim(); if (note) ev.note = note;
  cal.events.push(ev); $("fTitle").value = ""; $("fNote").value = ""; $("fRepeat").checked = false; save();
});

/* ---------- import events: picker and drag & drop ---------- */
const evKey = x => (x.date || "E" + x.easter) + "|" + x.title;
function mergeEvents(list) {
  const seen = new Set([...cal.events, ...hol().events].map(evKey)); let added = 0, dup = 0;
  list.forEach(x => { if (seen.has(evKey(x))) { dup++; return; } cal.events.push(x); seen.add(evKey(x)); added++; });
  return { added, dup };
}
async function importFile(file, mode) {
  let obj, res;
  try { obj = JSON.parse(await file.text()); res = normalize(obj); }
  catch (err) { toast(t("tNotCalFile", { file: file.name, err: err instanceof SyntaxError ? t("tInvalidJson") : err.message })); return null; }
  if (mode === "add") return { ...mergeEvents(res.events), skipped: res.skipped };
  const ok = await ask(t("askReplaceTitle"), t("askReplaceText", { n: cal.events.length, m: res.events.length, file: file.name }), t("replace"), t("cancel"));
  if (!ok) return null;
  cal = { name: obj.name || file.name.replace(/\.json$/i, ""), description: obj.description, events: res.events };
  return { replaced: res.events.length, skipped: res.skipped };
}
function reportImport(results) {
  const ok = results.filter(Boolean); if (!ok.length) return;
  save();
  const sum = k => ok.reduce((n, r) => n + (r[k] || 0), 0);
  const extra = (sum("dup") ? t("tDup", { n: sum("dup") }) : "") + (sum("skipped") ? t("tSkipped", { n: sum("skipped") }) : "");
  const rep = ok.find(r => r.replaced != null);
  toast((rep ? t("tReplaced", { n: rep.replaced }) : t("tAdded", { n: sum("added") })) + extra);
}
$("fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  reportImport([await importFile(f, $("mergeChk").checked ? "add" : "replace")]);
  e.target.value = "";
});

/* Drop zone: shown only while a file is actually being dragged over the page.
   dragover fires continuously during a drag, so if it stops (drag cancelled, dropped elsewhere,
   Esc pressed) the overlay hides itself instead of getting stuck. */
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes("Files");
let dropTimer = null;
const hideDrop = () => { clearTimeout(dropTimer); $("dropZone").hidden = true; };
const keepDrop = () => { $("dropZone").hidden = false; clearTimeout(dropTimer); dropTimer = setTimeout(hideDrop, 250); };
window.addEventListener("dragenter", e => { if (isFileDrag(e)) keepDrop(); });
window.addEventListener("dragover", e => { if (!isFileDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; keepDrop(); });
window.addEventListener("dragleave", e => { if (isFileDrag(e) && !e.relatedTarget) hideDrop(); });
window.addEventListener("dragend", hideDrop);
window.addEventListener("blur", hideDrop);
$("dropZone").addEventListener("click", hideDrop);
window.addEventListener("drop", async e => {
  hideDrop();
  if (!isFileDrag(e)) return;
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => /\.json$/i.test(f.name) || f.type === "application/json");
  if (!files.length) return toast(t("tDropJson"));
  const results = []; for (const f of files) results.push(await importFile(f, "add"));
  reportImport(results);
});

/* ---------- export ---------- */
$("exportJson").onclick = () => {
  download(`calendar-${TODAY}.json`, JSON.stringify(evSnapshot(), null, 2), "application/json");
  if (hasStorage || inFrame) toast(t("tNoDownload"));
};
$("exportBtn").onclick = () => { $("expText").value = JSON.stringify(evSnapshot(), null, 2); $("copyMsg").textContent = ""; $("exportDlg").hidden = false; $("copyBtn").focus(); };
$("closeExp").onclick = () => { $("exportDlg").hidden = true; };
$("exportDlg").addEventListener("click", e => { if (e.target.id === "exportDlg") $("exportDlg").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("exportDlg").hidden = true; hideDrop(); } });
$("copyBtn").onclick = () => {
  const ta = $("expText");
  navigator.clipboard.writeText(ta.value).then(() => { $("copyMsg").textContent = t("copied"); })
    .catch(() => { ta.focus(); ta.select(); $("copyMsg").textContent = t("copyFallback"); });
};

/* ---------- Data files (Edge/Chrome, opened as a local file or from https/localhost) ----------
   The browser can't open a fixed path by itself. The user picks each file once; the calendar keeps
   the file handles in IndexedDB, saves every event change to the events file, reads the holidays and
   translations files, and loads all of them on the next visit (the browser may ask for permission once per visit). */
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
const FS_OK = !hasStorage && !inFrame && "showOpenFilePicker" in window && "indexedDB" in window;
const DIRTY_KEY = KEY + ":fileDirty";
let fileHandle = null, filePerm = false, writeTimer = null;

function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("year-calendar", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      try { const tx = rq.result.transaction("kv", mode), r = fn(tx.objectStore("kv")); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); }
      catch (e) { rej(e); }
    };
  });
}
const idbGet = k => idb("readonly", st => st.get(k)).catch(() => null);
const idbSet = (k, v) => idb("readwrite", st => st.put(v, k)).catch(() => null);
const idbDel = k => idb("readwrite", st => st.delete(k)).catch(() => null);
const isDirty = () => { try { return LOCAL?.getItem(DIRTY_KEY) === "1"; } catch { return false; } };
const setDirty = v => { try { v ? LOCAL?.setItem(DIRTY_KEY, "1") : LOCAL?.removeItem(DIRTY_KEY); } catch {} };

function srcRowHtml(k) {
  const s = SRC[k];
  const state = s.handle ? (s.perm ? t("stLinked") : t("stNeedsPerm")) : s.source === "built-in" ? t("stBuiltIn") : t("stStored");
  const info = (s.handle ? (s.perm ? t("srcLinked", { name: s.handle.name }) : t("srcPerm", { name: s.handle.name }))
    : s.source === "built-in" ? t("srcBuiltIn", { file: s.file }) : t("srcStored", { name: s.data.name })) + " " + t("entries", { n: s.count(s.data) });
  return `<div class="file-row">
    <div class="label"><span>${esc(t(s.label))}</span><span>${esc(state)}</span></div>
    <p class="help">${esc(info)}</p>
    <div class="acts">
      ${FS_OK ? `<button class="btn" type="button" data-src="${k}" data-act="open">${esc(t("connectFile"))}</button>` : ""}
      ${FS_OK && s.handle ? `<button class="btn" type="button" data-src="${k}" data-act="reload">${esc(t("reloadFromFile"))}</button>
        <button class="btn" type="button" data-src="${k}" data-act="unlink">${esc(t("disconnect"))}</button>` : ""}
      <label class="btn filebtn"><span>${esc(t("loadJson"))}</span><input type="file" data-src="${k}" accept=".json,application/json"></label>
      <button class="btn" type="button" data-src="${k}" data-act="builtin">${esc(t("useBuiltIn"))}</button>
    </div></div>`;
}
function updateFileUI() {
  document.querySelectorAll(".fs-only").forEach(el => el.hidden = !FS_OK);
  $("fsNote").textContent = FS_OK ? "" : (hasStorage || inFrame) ? t("fsNoteFrame") : t("fsNoteBrowser");
  $("saveNow").textContent = FS_OK && !fileHandle ? t("saveToFile") : t("save");
  $("saveNow").title = !FS_OK ? t("saveTitleDownload") : fileHandle ? t("saveTitleLinked", { name: fileHandle.name }) : t("saveTitleFirst");
  const btn = $("fileBtn");
  const needs = FS_OK && ((fileHandle && !filePerm) || Object.values(SRC).some(s => s.handle && !s.perm));
  btn.classList.toggle("linked", FS_OK && !!fileHandle && !needs);
  btn.classList.toggle("attention", !!needs);
  btn.textContent = needs ? t("reconnectFiles") : fileHandle ? t("fileBtnLinked", { name: fileHandle.name }) : t("dataFiles");
  btn.title = needs ? t("reconnectTip") : t("dataFilesTip");
  $("fileLinked").hidden = !FS_OK || !fileHandle;
  $("evState").textContent = !fileHandle ? t("stNotLinked") : filePerm ? t("stLinked") : t("stNeedsPerm");
  $("fileInfo").textContent = !fileHandle ? t("evInfoNone") : filePerm ? t("evInfoLinked", { name: fileHandle.name }) : t("evInfoPerm", { name: fileHandle.name });
  $("srcRows").innerHTML = Object.keys(SRC).map(srcRowHtml).join("");
  if (fileHandle && filePerm) setSaveState(isDirty() ? "stateNotSavedTo" : "stateSavedTo", { name: fileHandle.name });
  else if (fileHandle) setSaveState("stateReconnect", { name: fileHandle.name });
  renderInfo();
}

async function askPermission(h, mode) {
  if (!h) return false;
  const opts = { mode };
  try { return (await h.queryPermission(opts)) === "granted" || (await h.requestPermission(opts)) === "granted"; } catch { return false; }
}
function parseCal(text, fallbackName) {
  const d = JSON.parse(text);
  return { name: d.name || fallbackName, description: d.description, events: normalize(d).events };
}
async function writeFile() {
  clearTimeout(writeTimer);
  if (!fileHandle || !filePerm) return false;
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(evSnapshot(), null, 2)); await w.close();
    setDirty(false); updateFileUI(); return true;
  } catch (e) { setDirty(true); setSaveState("stateCantSave", { name: fileHandle.name }); return false; }
}
/* called by save() after every event change */
function fileChanged() {
  if (!FS_OK || !fileHandle) return;
  setDirty(true);
  if (!filePerm) return updateFileUI();
  setSaveState("stateSavingTo", { name: fileHandle.name });
  clearTimeout(writeTimer); writeTimer = setTimeout(writeFile, 400);
}
/* Load the events file. If the calendar has changes the file doesn't have, ask first. */
async function loadFromFile() {
  filePerm = await askPermission(fileHandle, "readwrite");
  if (!filePerm) { updateFileUI(); toast(t("tAccessDenied")); return; }
  let fromFile;
  try { fromFile = parseCal(await (await fileHandle.getFile()).text(), fileHandle.name); }
  catch { updateFileUI(); toast(t("tNotEventsFile", { name: fileHandle.name })); return; }
  const same = JSON.stringify(fromFile.events) === JSON.stringify(cal.events);
  if (!same && isDirty() && cal.events.length) {
    const keep = await ask(t("unsavedTitle"), t("unsavedText", { name: fileHandle.name }), t("saveEventsToFile"), t("loadDropChanges"));
    if (keep === null) return updateFileUI();
    if (keep) { await writeFile(); toast(t("tSavedEventsTo", { name: fileHandle.name })); return; }
  }
  cal = fromFile; setDirty(false); invalidate(); render(); await persist(); updateFileUI();
  toast(t("tLoadedEvents", { n: cal.events.length, name: fileHandle.name }));
}
let rememberFailed = false;
async function useHandle(h) { fileHandle = h; filePerm = false; rememberFailed = !(await idbSet("dataFile", h)); }

/* read-only files: holidays and translations */
async function loadSrcFromFile(k, quiet) {
  const s = SRC[k];
  s.perm = await askPermission(s.handle, "read");
  if (!s.perm) { updateFileUI(); if (!quiet) toast(t("tAccessDenied")); return; }
  try {
    const f = await s.handle.getFile(), { data, skipped } = s.parse(JSON.parse(await f.text()), f.name.replace(/\.json$/i, ""));
    s.data = data; s.source = "file"; await saveSrc(k);
    if (!quiet) toast(t("tLoadedSource", { name: s.handle.name, n: s.count(data) }) + (skipped ? t("tSkipped", { n: skipped }) : ""));
  } catch { updateFileUI(); toast(t("tNotSourceFile", { name: s.handle.name })); }
}
async function unlinkSrc(k) { const s = SRC[k]; if (s.handle) { await idbDel(s.idb); s.handle = null; s.perm = false; } }
async function defaultSrc(k) {
  const s = SRC[k];
  try { const r = await fetch(s.file, { cache: "no-cache" }); if (r.ok) return s.parse(await r.json(), s.file).data; } catch {}
  return structuredClone(s.builtin);
}
$("srcRows").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const k = b.dataset.src, s = SRC[k];
  if (b.dataset.act === "open") {
    try {
      const [h] = await window.showOpenFilePicker({ types: jsonTypes, id: "year-calendar-" + k, startIn: s.handle || "documents" });
      s.handle = h; s.perm = false; await idbSet(s.idb, h);
      await loadSrcFromFile(k, false);
    } catch (err) { if (err.name !== "AbortError") toast(t("tCouldntOpen")); }
  } else if (b.dataset.act === "reload") await loadSrcFromFile(k, false);
  else if (b.dataset.act === "unlink") { await unlinkSrc(k); s.source = "stored"; await saveSrc(k); toast(t("tDisconnected")); }
  else if (b.dataset.act === "builtin") { await unlinkSrc(k); s.data = await defaultSrc(k); s.source = "built-in"; await saveSrc(k); toast(t("tUsingBuiltIn")); }
});
$("srcRows").addEventListener("change", async e => {
  const inp = e.target.closest("input[type=file][data-src]"); if (!inp) return;
  const f = inp.files[0], k = inp.dataset.src, s = SRC[k]; if (!f) return;
  try {
    const { data, skipped } = s.parse(JSON.parse(await f.text()), f.name.replace(/\.json$/i, ""));
    await unlinkSrc(k); s.data = data; s.source = "stored"; await saveSrc(k);
    toast(t("tLoadedSource", { name: f.name, n: s.count(data) }) + (skipped ? t("tSkipped", { n: skipped }) : ""));
  } catch { toast(t("tNotSourceFile", { name: f.name })); }
});

async function initFiles() {
  if (!FS_OK) return updateFileUI();
  for (const k of Object.keys(SRC)) {
    const s = SRC[k];
    s.handle = await idbGet(s.idb);
    if (s.handle) { try { s.perm = (await s.handle.queryPermission({ mode: "read" })) === "granted"; } catch { s.perm = false; } if (s.perm) await loadSrcFromFile(k, true); }
  }
  fileHandle = await idbGet("dataFile");
  if (fileHandle) { try { filePerm = (await fileHandle.queryPermission({ mode: "readwrite" })) === "granted"; } catch { filePerm = false; } if (filePerm) await loadFromFile(); }
  updateFileUI();
}

const jsonTypes = [{ description: "Calendar JSON", accept: { "application/json": [".json"] } }];
$("fileBtn").addEventListener("click", async () => {
  if (FS_OK && $("fileBtn").classList.contains("attention")) {   // one-click reconnect of all files
    for (const k of Object.keys(SRC)) if (SRC[k].handle && !SRC[k].perm) await loadSrcFromFile(k, false);
    if (fileHandle && !filePerm) await loadFromFile();
    return;
  }
  updateFileUI(); $("fileDlg").showModal();
});
$("fileClose").onclick = () => $("fileDlg").close();
$("fileLoad").addEventListener("click", async () => { $("fileDlg").close(); await loadFromFile(); });
$("fileSave").addEventListener("click", async () => {
  filePerm = await askPermission(fileHandle, "readwrite");
  if (!filePerm) return toast(t("tAccessDenied"));
  if (await writeFile()) toast(t("tSavedTo", { name: fileHandle.name }));
});
$("fileOpen").addEventListener("click", async () => {
  try {
    const [h] = await window.showOpenFilePicker({ types: jsonTypes, id: "year-calendar", startIn: fileHandle || "documents" });
    await useHandle(h); $("fileDlg").close(); await loadFromFile();
  } catch (e) { if (e.name !== "AbortError") toast(t("tCouldntOpen")); }
});
$("fileCreate").addEventListener("click", () => saveAs());
$("fileUnlink").addEventListener("click", async () => {
  await idbDel("dataFile"); fileHandle = null; filePerm = false; setDirty(false);
  updateFileUI(); setSaveState("stateSavedBrowser");
  toast(t("tUnlinked"));
});

/* Save (Ctrl+S): write to the remembered events file. First time, a Save-as window opens
   with "calendar.json" suggested; any name and folder can be chosen.
   Save as… (Ctrl+Shift+S): choose another name/location; that file is remembered from then on.
   Without file access (Firefox, or inside Claude), it downloads a backup instead. */
async function saveNow() {
  if (!FS_OK) {
    download(`calendar-${TODAY}.json`, JSON.stringify(evSnapshot(), null, 2), "application/json");
    return toast(hasStorage || inFrame ? t("tSavedAuto") : t("tDownloaded"));
  }
  if (!fileHandle) return saveAs();
  filePerm = await askPermission(fileHandle, "readwrite");
  if (!filePerm) { updateFileUI(); return toast(t("tAccessDenied")); }
  if (await writeFile()) toast(t("tSavedTo", { name: fileHandle.name }));
}
async function pickSaveTarget() {
  const suggestedName = fileHandle?.name || "calendar.json";
  try { return await window.showSaveFilePicker({ types: jsonTypes, id: "year-calendar", suggestedName, startIn: fileHandle || "documents" }); }
  catch (e) {
    if (e.name === "AbortError") return null;
    /* Some Windows setups refuse the Save-as window when replacing a file: pick the existing file instead */
    toast(t("tSaveAsFailed"));
    try { return (await window.showOpenFilePicker({ types: jsonTypes, id: "year-calendar", startIn: fileHandle || "documents" }))[0]; }
    catch (e2) { if (e2.name !== "AbortError") toast(t("tCouldntOpen")); return null; }
  }
}
async function saveAs() {
  if (!FS_OK) return saveNow();
  const h = await pickSaveTarget();
  if (!h) return;
  if (!(await askPermission(h, "readwrite"))) { updateFileUI(); return toast(t("tSaveDenied")); }
  let fileEvents = null;
  try { fileEvents = parseCal(await (await h.getFile()).text(), h.name).events; } catch { /* new or empty file */ }
  await useHandle(h); filePerm = true;
  if (fileEvents && fileEvents.length && !cal.events.length) { setDirty(false); return loadFromFile(); }   // nothing here: never wipe a file that has events
  if ($("fileDlg").open) $("fileDlg").close();
  if (await writeFile()) toast(rememberFailed ? t("tCantRemember", { name: h.name }) : t("tSavedRemembered", { name: h.name }));
  updateFileUI();
}
$("saveNow").addEventListener("click", saveNow);
$("saveAs").addEventListener("click", () => saveAs());
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    if (document.querySelector("dialog[open]")) return;
    e.shiftKey ? saveAs() : saveNow();
  }
});

/* ---------- boot ---------- */
const savedLang = recall(KEY + "-lang"); if (typeof savedLang === "string") lang = savedLang;
const savedHol = recall(KEY + "-holset"); if (typeof savedHol === "string") holKey = savedHol;
const savedPal = recall(KEY + "-palette"); if (typeof savedPal === "string") palette = savedPal;
load().then(async () => {
  if (!cal) cal = { name: "My events", events: [] };
  for (const k of Object.keys(SRC)) if (!SRC[k].data || SRC[k].source === "built-in") { SRC[k].data = await defaultSrc(k); SRC[k].source = "built-in"; }
  buildLangSelect(); buildHolSelect(); buildPaletteSelect(); applyTheme(); invalidate(); rerenderAll();
  await initFiles();
});
})();
</script>
</body>
</html>
